services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-CNPJ Reader API}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DOCKER_DB_DATABASE:-cnpj_reader}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-cnpj}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-cnpj_local_password}"
      DB_URL: ""
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
    volumes:
      - ./.env:/var/www/html/.env
    command:
      - sh
      - -c
      - |
        if [ -z "$${APP_KEY}" ]; then
          echo "APP_KEY is empty. Generate it with: docker compose run --rm --no-deps app php artisan key:generate" >&2
          exit 1
        fi
        php artisan migrate --force
        exec apache2-foreground
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-cnpj_reader}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-cnpj}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-cnpj_local_password}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-local_root_password}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
