services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY:?Configure APP_KEY no .env com php artisan key:generate}"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DOCKER_DB_DATABASE:-cnpj_reader}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-cnpj}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-cnpj_local_password}"
      DB_URL: ""
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-cnpj_reader}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-cnpj}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-cnpj_local_password}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-local_root_password}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
